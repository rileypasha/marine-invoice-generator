<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
    <script>
        console.log('=== INLINE SCRIPT STARTED ===');
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('=== DOM LOADED ===');
            
            // Create a simple button for testing
            const testBtn = document.createElement('button');
            testBtn.textContent = 'TEST BUTTON';
            testBtn.style.position = 'fixed';
            testBtn.style.top = '10px';
            testBtn.style.right = '10px';
            testBtn.style.backgroundColor = 'red';
            testBtn.style.color = 'white';
            testBtn.style.padding = '10px';
            testBtn.style.zIndex = '9999';
            
            testBtn.addEventListener('click', () => {
                console.log('🔥 TEST BUTTON CLICKED');
                alert('Button works!');
                
                // Clear all inputs on page
                const inputs = document.querySelectorAll('input');
                console.log('Found inputs:', inputs.length);
                inputs.forEach((input, i) => {
                    console.log(`Clearing input ${i}: ${input.value} -> empty`);
                    input.value = '';
                });
            });
            
            document.body.appendChild(testBtn);
            console.log('✅ Test button added');
        });
        
        // Load the actual app
        setTimeout(() => {
            console.log('=== LOADING MAIN APP ===');
            const iframe = document.createElement('iframe');
            iframe.src = 'http://localhost:3000';
            iframe.style.width = '100%';
            iframe.style.height = '80vh';
            iframe.style.border = '1px solid red';
            document.body.appendChild(iframe);
            
            iframe.onload = () => {
                console.log('=== IFRAME LOADED ===');
                setTimeout(() => {
                    try {
                        const doc = iframe.contentDocument;
                        const win = iframe.contentWindow;
                        
                        console.log('iframe window:', !!win);
                        console.log('iframe document:', !!doc);
                        console.log('app object:', !!win.app);
                        console.log('sidebar element:', !!doc.querySelector('.app-sidebar'));
                        console.log('new button:', !!doc.querySelector('.new-invoice-btn'));
                        
                        // Try to click the button
                        const btn = doc.querySelector('.new-invoice-btn');
                        if (btn) {
                            console.log('🎯 FOUND BUTTON - CLICKING');
                            btn.click();
                        }
                        
                    } catch (e) {
                        console.error('Iframe access error:', e);
                    }
                }, 2000);
            };
        }, 1000);
    </script>
</head>
<body>
    <h1>Debug Test Page</h1>
    <p>Check console for debug info</p>
</body>
</html>
