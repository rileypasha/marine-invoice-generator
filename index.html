    <!--
      System font stack - no custom fonts needed, uses native OS fonts
      This eliminates font loading delay and CLS issues
      Performance gain: ~200-300ms faster FCP
    -->
    <style>
      /* Critical CSS - inlined for instant rendering */
      :root {
        /* Use system fonts for zero loading time */
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                     "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                     Monaco, Consolas, monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
        background: #fff;
        /* Extend background color beyond viewport into safe areas */
        background-attachment: fixed;
      }

      body {
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-size: 16px;
        line-height: 1.5;
        overflow-y: auto; /* Allow vertical scrolling */
      }

      /* Prevent flash of unstyled content */
      #root {
        min-height: 100%;
        background-color: #fff;
      }

      /* Modern skeleton loader styles */
      .app-loader {
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 9999;
      }

      .app-loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: #f3f4f6;
        overflow: hidden;
      }

      .app-loader-bar::after {
        content: '';
        display: block;
        height: 100%;
        background: rgba(0, 61, 91, 0.7);
        border-radius: 0 9999px 9999px 0;
        animation: barSlide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes barSlide {
        0%   { width: 0%; margin-left: 0%; }
        50%  { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }

      .app-skeleton {
        max-width: 80rem;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 0;
      }

      .app-sk-row {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .app-sk-block {
        border-radius: 0.5rem;
        position: relative;
        overflow: hidden;
      }

      .app-sk-block::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.6) 50%, transparent 100%);
        animation: skShimmer 1.8s ease-in-out infinite;
      }

      @keyframes skShimmer {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .app-sk-table {
        border: 1px solid #f3f4f6;
        border-radius: 0.75rem;
        overflow: hidden;
      }

      .app-sk-thead {
        background: rgba(249,250,251,0.6);
        border-bottom: 1px solid #f3f4f6;
        padding: 0.875rem 1.25rem;
        display: flex;
        gap: 1rem;
      }

      .app-sk-trow {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #f9fafb;
      }

      .app-sk-trow:last-child { border-bottom: none; }

      /* Reduce motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        #root {
          background-color: #000;
          color: #ffffff;
        }
      }
    </style>

    <!-- Performance monitoring - runs after app loads -->
    <script>
      // Report Web Vitals to analytics (if available)
      if ('PerformanceObserver' in window) {
        // Monitor Largest Contentful Paint (LCP)
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            console.log('LCP:', entry.renderTime || entry.loadTime);
          }
        }).observe({ type: 'largest-contentful-paint', buffered: true });

        // Monitor First Input Delay (FID)
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            console.log('FID:', entry.processingStart - entry.startTime);
          }
        }).observe({ type: 'first-input', buffered: true });

        // Monitor Cumulative Layout Shift (CLS)
        let clsValue = 0;
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (!entry.hadRecentInput) {
              clsValue += entry.value;
              console.log('CLS:', clsValue);
            }
          }
        }).observe({ type: 'layout-shift', buffered: true });
      }
    </script>
