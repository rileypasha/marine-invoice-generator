<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="Invoice and request management for marine services" />

    <!-- PWA Theme Colors -->
    <meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0369a1" media="(prefers-color-scheme: dark)" />

    <!-- PWA Capability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marine Group" />

    <title>Marine Group Global Services</title>

    <!-- Favicon and PWA Icons -->
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preconnect to critical origins (DNS + TLS handshake) -->
    <link rel="preconnect" href="http://127.0.0.1:3001" crossorigin />
    <link rel="dns-prefetch" href="http://127.0.0.1:3001" />

    <!--
      System font stack - no custom fonts needed, uses native OS fonts
      This eliminates font loading delay and CLS issues
      Performance gain: ~200-300ms faster FCP
    -->
    <style>
      /* Critical CSS - inlined for instant rendering */
      :root {
        /* Use system fonts for zero loading time */
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                     "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                     Monaco, Consolas, monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        /* Prevent layout shift during font load */
        font-size: 16px;
        line-height: 1.5;
      }

      /* Prevent flash of unstyled content */
      #root {
        min-height: 100vh;
        background-color: #ffffff;
      }

      /* Loading spinner styles - prevent CLS */
      .app-loader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #3498db;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }

      /* Reduce motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        #root {
          background-color: #1a1a1a;
          color: #ffffff;
        }
      }
    </style>

    <!-- Preload critical resources -->
    <!-- Note: Actual chunk names will be generated during build -->
    <!-- These are placeholders - Vite will inject correct paths -->

    <!-- Resource hints for better performance -->
    <link rel="modulepreload" href="/src/main.tsx" />
  </head>
  <body>
    <div id="root">
      <!-- Initial loading indicator to prevent blank screen -->
      <div class="app-loader" aria-label="Loading application"></div>
    </div>

    <!-- Main app bundle - type="module" for modern browsers -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Performance monitoring - runs after app loads -->
    <script>
      // Report Web Vitals to analytics (if available)
      if ('PerformanceObserver' in window) {
        // Monitor Largest Contentful Paint (LCP)
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            console.log('LCP:', entry.renderTime || entry.loadTime);
          }
        }).observe({ type: 'largest-contentful-paint', buffered: true });

        // Monitor First Input Delay (FID)
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            console.log('FID:', entry.processingStart - entry.startTime);
          }
        }).observe({ type: 'first-input', buffered: true });

        // Monitor Cumulative Layout Shift (CLS)
        let clsValue = 0;
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (!entry.hadRecentInput) {
              clsValue += entry.value;
              console.log('CLS:', clsValue);
            }
          }
        }).observe({ type: 'layout-shift', buffered: true });
      }
    </script>
  </body>
</html>
