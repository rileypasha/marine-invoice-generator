<!DOCTYPE html>
<html>
<head>
    <title>Manual Test</title>
    <script>
        console.log('MANUAL TEST SCRIPT LOADED');
        
        // Force open the page and check console
        setTimeout(() => {
            window.open('http://localhost:3000', '_blank');
            
            // Simple test button
            const btn = document.createElement('button');
            btn.textContent = 'FORCE TEST NEW INVOICE';
            btn.style.position = 'fixed';
            btn.style.top = '10px';
            btn.style.left = '10px';
            btn.style.backgroundColor = 'red';
            btn.style.color = 'white';
            btn.style.padding = '20px';
            btn.style.fontSize = '16px';
            btn.style.zIndex = '99999';
            
            btn.onclick = () => {
                console.log('MANUAL BUTTON CLICKED');
                
                // Try to access the opened window
                const newWindow = window.open('http://localhost:3000', '_blank');
                
                setTimeout(() => {
                    try {
                        if (newWindow.testNewInvoiceButton) {
                            console.log('CALLING testNewInvoiceButton');
                            newWindow.testNewInvoiceButton();
                        } else {
                            console.log('testNewInvoiceButton not found');
                        }
                        
                        // Try direct manipulation
                        const inputs = newWindow.document.querySelectorAll('input');
                        console.log('Found inputs:', inputs.length);
                        inputs.forEach(input => {
                            input.value = '';
                            console.log('Cleared:', input.id);
                        });
                        
                    } catch (e) {
                        console.error('Error:', e);
                    }
                }, 3000);
            };
            
            document.body.appendChild(btn);
            
        }, 1000);
    </script>
</head>
<body>
    <h1>Manual Test Page</h1>
    <p>This will open the app and test functionality</p>
</body>
</html>
