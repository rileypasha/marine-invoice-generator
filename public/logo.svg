<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Black background with subtle gradient for depth -->
    <linearGradient id="blackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filters for 3D effect -->
    <filter id="mainShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Document shadow -->
    <filter id="docShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle highlight for 3D effect -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Main rounded square background with shadow -->
  <rect x="40" y="40" width="432" height="432" rx="95" ry="95" 
        fill="url(#blackGradient)" 
        filter="url(#mainShadow)"/>
  
  <!-- Subtle inner shadow for depth -->
  <rect x="40" y="40" width="432" height="432" rx="95" ry="95" 
        fill="none" 
        filter="url(#innerShadow)"/>
  
  <!-- Top highlight for 3D effect -->
  <rect x="40" y="40" width="432" height="216" rx="95" ry="95" 
        fill="url(#highlightGradient)" 
        opacity="0.3"/>
  
  <!-- Document icon with proper folded corner -->
  <g transform="translate(256, 256)" filter="url(#docShadow)">
    <!-- Document shadow base -->
    <path d="M -75 -95 L 50 -95 L 75 -70 L 75 95 L -75 95 Z" 
          fill="#000000" 
          opacity="0.2"
          transform="translate(0, 3)"/>
    
    <!-- Main document body -->
    <path d="M -75 -95 L 50 -95 L 75 -70 L 75 95 L -75 95 Z" 
          fill="#ffffff"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linejoin="miter"/>
    
    <!-- Folded corner triangle -->
    <path d="M 50 -95 L 75 -70 L 50 -70 Z" 
          fill="#e5e5e5"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linejoin="miter"/>
    
    <!-- Folded corner crease line -->
    <line x1="50" y1="-95" x2="50" y2="-70" 
          stroke="#d4d4d4" 
          stroke-width="1.5"/>
    
    <!-- Document lines (invoice text lines) -->
    <line x1="-50" y1="-40" x2="50" y2="-40" 
          stroke="#1a1a1a" 
          stroke-width="7" 
          stroke-linecap="round"/>
    <line x1="-50" y1="0" x2="50" y2="0" 
          stroke="#1a1a1a" 
          stroke-width="7" 
          stroke-linecap="round"/>
    <line x1="-50" y1="40" x2="30" y2="40" 
          stroke="#1a1a1a" 
          stroke-width="7" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Subtle bottom shadow for lifted effect -->
  <ellipse cx="256" cy="480" rx="180" ry="15" 
           fill="#000000" 
           opacity="0.4"/>
</svg>