<?xml version="1.0" encoding="UTF-8"?>
<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Black gradient for button -->
    <linearGradient id="blackButtonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Button shadow -->
    <filter id="buttonShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Top highlight for 3D effect -->
    <linearGradient id="buttonHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circular button with shadow -->
  <g filter="url(#buttonShadow)">
    <circle cx="28" cy="28" r="24" 
            fill="url(#blackButtonGradient)"/>
    
    <!-- Top highlight for 3D effect -->
    <circle cx="28" cy="28" r="24" 
            fill="url(#buttonHighlight)"/>
    
    <!-- Subtle inner shadow -->
    <circle cx="28" cy="28" r="24" 
            fill="none" 
            filter="url(#innerShadow)"/>
  </g>
  
  <!-- Install/Download icon -->
  <g transform="translate(28, 28)">
    <!-- Arrow shaft -->
    <line x1="0" y1="-10" x2="0" y2="4" 
          stroke="white" 
          stroke-width="3" 
          stroke-linecap="round"/>
    
    <!-- Arrow head -->
    <polyline points="-5,0 0,5 5,0" 
              stroke="white" 
              stroke-width="3" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              fill="none"/>
    
    <!-- Base line (platform) -->
    <line x1="-7" y1="11" x2="7" y2="11" 
          stroke="white" 
          stroke-width="3" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Bottom shadow for floating effect -->
  <ellipse cx="28" cy="52" rx="18" ry="3" 
           fill="#000000" 
           opacity="0.3"/>
</svg>