services:
  - type: web
    name: marine-invoice-generator
    runtime: node
    buildCommand: npm ci && npm run build && npm run prisma:generate
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: marine-invoice-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://marine-invoice-generator.onrender.com

databases:
  - name: marine-invoice-db
    databaseName: marine_invoice
    plan: free