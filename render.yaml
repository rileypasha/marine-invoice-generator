services:
  # Unified Web Service - Marine Group Invoice System (React + Node.js)
  - type: web
    name: marine-group-invoices
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build:all
    startCommand: npm run start:production
    postBuildCommand: npm run reset:passwords
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BUILD_VERSION
        value: v1.0.4
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: marine-group-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: pserv
          name: marine-group-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mginvoices.com,https://www.mginvoices.com,https://marine-invoice-generator.onrender.com
      - key: COOKIE_DOMAIN
        value: .mginvoices.com
    autoDeploy: true

  # PostgreSQL Database
  - type: pserv
    name: marine-group-db
    databaseName: marine_invoices
    region: oregon
    plan: starter

  # Redis for session storage
  - type: pserv
    name: marine-group-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru