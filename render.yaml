services:
  - type: web
    name: marine-invoice-generator
    runtime: node
    buildCommand: npm install && npm run build && npm run prisma:generate
    startCommand: npm run server:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: marine-invoice-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://marine-invoice-generator.onrender.com,https://mginvoices.com
      - key: MASTER_EMAILS
        value: rpasha@marinegroupbw.com
      - key: GEOAPIFY_API_KEY
        value: 6291b90c7f8c4f888dda207c2f7f349a

databases:
  - name: marine-invoice-db
    databaseName: marine_invoice
    plan: free