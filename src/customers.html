<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Directory - MG Invoices</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="apple-touch-icon" href="./assets/favicon.png">
    <link rel="shortcut icon" href="./assets/favicon.png">

    <!-- Meta tags -->
    <meta name="description" content="Customer directory and management for Marine Group Invoice Generator">

    <!-- CSS -->
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/typeahead-combobox.css">
    <link rel="stylesheet" href="./styles/customers-page.css">

    <style>
        /* Page-specific styles */
        body {
            background: rgb(24, 24, 27); /* zinc-900 */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .page-container {
            display: flex;
            min-height: 100vh;
        }

        .page-sidebar {
            width: 72px;
            background: rgb(9, 9, 11); /* zinc-950 to match invoice.png baseline */
            border-right: 1px solid rgb(39, 39, 42); /* zinc-800 */
            padding: 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .page-main {
            flex: 1;
            margin-left: 72px;
            min-height: 100vh;
        }

        .page-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            color: rgb(161, 161, 170); /* zinc-400 */
            text-decoration: none;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            transition: all 0.2s ease-in-out;
            position: relative;
        }

        .nav-item:hover {
            background: rgb(39, 39, 42); /* zinc-800 */
            color: rgb(244, 244, 245); /* zinc-100 */
        }

        .nav-item--active {
            background: rgb(39, 39, 42); /* zinc-800 */
            color: white;
        }

        .nav-item-text {
            display: none; /* Hide text for icon-only design */
        }

        .nav-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 3.5rem;
            border-bottom: 1px solid rgb(39, 39, 42); /* zinc-800 */
            margin-bottom: 1rem;
        }

        .nav-brand__logo {
            width: 2rem;
            height: 2rem;
            background: rgb(79, 70, 229); /* indigo-600 to match baseline */
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .nav-brand__text {
            display: none; /* Hide for icon-only sidebar */
        }

        @media (max-width: 1024px) {
            .page-sidebar {
                transform: translateX(-72px);
                transition: transform 0.3s ease-in-out;
                z-index: 1000;
            }

            .page-sidebar--open {
                transform: translateX(0);
            }

            .page-main {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Sidebar Navigation -->
        <nav class="page-sidebar">
            <div class="nav-brand">
                <div class="nav-brand__logo">MG</div>
                <div class="nav-brand__text">Marine Group</div>
            </div>

            <div class="page-nav">
                <a href="/app" class="nav-item" title="Invoices">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14,2 14,8 20,8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10,9 9,9 8,9"/>
                    </svg>
                    <span class="nav-item-text">Invoices</span>
                </a>

                <a href="/customers" class="nav-item nav-item--active" title="Customers">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span class="nav-item-text">Customers</span>
                </a>


                <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgb(39, 39, 42); width: 100%; display: flex; justify-content: center;">
                    <a href="/settings" class="nav-item" title="Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        <span class="nav-item-text">Settings</span>
                    </a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="page-main">
            <div id="customers-page"></div>
        </main>
    </div>

    <!-- JavaScript bundle will be injected by webpack -->
</body>
</html>
