<!DOCTYPE html>
<html>
<head>
    <title>Session Diagnostic</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #000;
            color: #0f0;
        }
        h1 { color: #0ff; }
        .section {
            background: #111;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid #0f0;
            border-radius: 5px;
        }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warning { color: #ff0; }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover { background: #0ff; }
        pre {
            background: #222;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Session Diagnostic Tool</h1>
    
    <div class="section">
        <h2>1. Cookie Check</h2>
        <div id="cookie-info">Checking cookies...</div>
    </div>
    
    <div class="section">
        <h2>2. Session Check</h2>
        <button onclick="checkSession()">Check Session Status</button>
        <div id="session-info"></div>
    </div>
    
    <div class="section">
        <h2>3. Login Test</h2>
        <button onclick="testLogin()">Test Login</button>
        <div id="login-info"></div>
    </div>
    
    <div class="section">
        <h2>4. Direct App Access</h2>
        <button onclick="testAppAccess()">Test /app Access</button>
        <div id="app-info"></div>
    </div>
    
    <div class="section">
        <h2>5. LocalStorage Check</h2>
        <div id="storage-info"></div>
    </div>
    
    <div class="section">
        <h2>6. Network Logs</h2>
        <pre id="network-log"></pre>
    </div>

    <script>
        const log = (msg, type = 'info') => {
            const logEl = document.getElementById('network-log');
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            const colorClass = type === 'error' ? 'error' : type === 'success' ? 'success' : 'warning';
            logEl.innerHTML += `<span class="${colorClass}">[${timestamp}] ${msg}</span>\n`;
        };

        // Check cookies
        const checkCookies = () => {
            const cookieEl = document.getElementById('cookie-info');
            const cookies = document.cookie;
            
            if (!cookies) {
                cookieEl.innerHTML = '<span class="error">❌ No cookies found</span>';
                log('No cookies in document.cookie', 'error');
            } else {
                const cookieList = cookies.split(';').map(c => c.trim());
                const sessionCookie = cookieList.find(c => c.startsWith('connect.sid'));
                
                if (sessionCookie) {
                    cookieEl.innerHTML = `<span class="success">✅ Session cookie found: ${sessionCookie.substring(0, 50)}...</span>`;
                    log('Session cookie present', 'success');
                } else {
                    cookieEl.innerHTML = '<span class="warning">⚠️ Cookies exist but no session cookie</span><br>Cookies: ' + cookies;
                    log('No session cookie found', 'warning');
                }
            }
        };

        // Check session
        const checkSession = async () => {
            const infoEl = document.getElementById('session-info');
            infoEl.innerHTML = 'Checking...';
            
            try {
                log('Fetching /api/auth/me with credentials: include...');
                const response = await fetch('/api/auth/me', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Accept': 'application/json'
                    }
                });
                
                const text = await response.text();
                log(`Response status: ${response.status}`);
                
                if (response.ok) {
                    const data = JSON.parse(text);
                    infoEl.innerHTML = `<span class="success">✅ Authenticated!</span><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    log('User authenticated: ' + data.user.email, 'success');
                } else {
                    infoEl.innerHTML = `<span class="error">❌ Not authenticated (${response.status})</span><pre>${text}</pre>`;
                    log('Not authenticated', 'error');
                }
            } catch (error) {
                infoEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log('Error checking session: ' + error.message, 'error');
            }
        };

        // Test login
        const testLogin = async () => {
            const infoEl = document.getElementById('login-info');
            infoEl.innerHTML = 'Attempting login...';
            
            try {
                log('Sending login request...');
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: 'test@marinegroupbw.com',
                        password: 'test'
                    })
                });
                
                const data = await response.json();
                log(`Login response: ${response.status}`);
                
                if (response.ok && data.success) {
                    infoEl.innerHTML = `<span class="success">✅ Login successful!</span><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    log('Login successful, sessionId: ' + data.sessionId, 'success');
                    
                    // Store in localStorage
                    localStorage.setItem('marine_invoice_user', JSON.stringify(data.user));
                    localStorage.setItem('marine_invoice_session', JSON.stringify({
                        timestamp: Date.now(),
                        valid: true
                    }));
                    
                    // Check cookies again
                    setTimeout(checkCookies, 500);
                } else {
                    infoEl.innerHTML = `<span class="error">❌ Login failed</span><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    log('Login failed', 'error');
                }
            } catch (error) {
                infoEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log('Login error: ' + error.message, 'error');
            }
        };

        // Test app access
        const testAppAccess = async () => {
            const infoEl = document.getElementById('app-info');
            infoEl.innerHTML = 'Testing /app access...';
            
            try {
                log('Fetching /app...');
                const response = await fetch('/app', {
                    credentials: 'include',
                    redirect: 'manual'
                });
                
                log(`/app response: ${response.status} ${response.type}`);
                
                if (response.status === 0 && response.type === 'opaqueredirect') {
                    infoEl.innerHTML = '<span class="warning">⚠️ /app is redirecting (probably to login)</span>';
                    log('/app redirected', 'warning');
                } else if (response.ok) {
                    const text = await response.text();
                    // Check for multiple indicators that this is the app page
                    const hasAppContent = text.includes('Marine') && text.includes('Invoice') && 
                                         (text.includes('invoice-preview') || text.includes('main.bundle.js'));
                    const hasLandingContent = text.includes('landing.bundle.js') || text.includes('Get Started');
                    
                    if (hasAppContent && !hasLandingContent) {
                        infoEl.innerHTML = '<span class="success">✅ /app accessible - app content found</span>';
                        log('/app accessible', 'success');
                    } else if (hasLandingContent) {
                        infoEl.innerHTML = '<span class="warning">⚠️ /app returned landing page instead of app</span>';
                        log('/app returned landing page', 'warning');
                    } else {
                        infoEl.innerHTML = '<span class="warning">⚠️ /app content unclear - check manually</span>';
                        log('/app content unclear', 'warning');
                    }
                } else {
                    infoEl.innerHTML = `<span class="error">❌ /app returned ${response.status}</span>`;
                    log(`/app error: ${response.status}`, 'error');
                }
            } catch (error) {
                infoEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log('App access error: ' + error.message, 'error');
            }
        };

        // Check localStorage
        const checkStorage = () => {
            const storageEl = document.getElementById('storage-info');
            const user = localStorage.getItem('marine_invoice_user');
            const session = localStorage.getItem('marine_invoice_session');
            
            let html = '';
            if (user) {
                html += `<span class="success">✅ User in localStorage:</span><pre>${user}</pre>`;
                log('LocalStorage has user', 'success');
            } else {
                html += '<span class="warning">⚠️ No user in localStorage</span><br>';
                log('No user in localStorage', 'warning');
            }
            
            if (session) {
                html += `<span class="success">✅ Session in localStorage:</span><pre>${session}</pre>`;
                log('LocalStorage has session', 'success');
            } else {
                html += '<span class="warning">⚠️ No session in localStorage</span>';
                log('No session in localStorage', 'warning');
            }
            
            storageEl.innerHTML = html;
        };

        // Run initial checks
        window.addEventListener('load', () => {
            log('=== Diagnostic Started ===', 'success');
            checkCookies();
            checkStorage();
        });
    </script>
</body>
</html>
