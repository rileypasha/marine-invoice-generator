<!DOCTYPE html>
<html lang="en">

    <style>
        body {
            background: hsl(var(--background));
            color: hsl(var(--foreground));

            margin: 0;
            padding: 20px;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
