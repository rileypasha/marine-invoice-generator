<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect Test</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .section {
            background: #111;
            border: 1px solid #0f0;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #0ff;
        }
        .log {
            background: #222;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        .warning { color: #ff0; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>🔄 Redirect Test Page</h1>
    
    <div class="section">
        <h2>Current Status</h2>
        <p>Domain: <span id="domain"></span></p>
        <p>Protocol: <span id="protocol"></span></p>
        <p>Auth Token: <span id="has-token"></span></p>
        <p>Auth Method: <span id="auth-method"></span></p>
    </div>
    
    <div class="section">
        <h2>Login & Redirect Test</h2>
        <button onclick="testLoginAndRedirect()">Test Login → Redirect</button>
        <button onclick="testDirectRedirect()">Test Direct Redirect</button>
        <button onclick="testLocationReplace()">Test location.replace()</button>
        <button onclick="testLocationAssign()">Test location.assign()</button>
        <button onclick="testMetaRedirect()">Test Meta Redirect</button>
        <button onclick="testFormRedirect()">Test Form Redirect</button>
    </div>
    
    <div class="section">
        <h2>Log</h2>
        <div id="log" class="log"></div>
    </div>

    <form id="redirect-form" action="/app" method="GET" style="display: none;"></form>

    <script>
        const log = (msg, type = 'info') => {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            const colorClass = type === 'error' ? 'error' : 
                              type === 'success' ? 'success' : 
                              type === 'warning' ? 'warning' : 'info';
            logEl.innerHTML += `<span class="${colorClass}">[${timestamp}] ${msg}</span>\n`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[${type}] ${msg}`);
        };

        // Update status
        const updateStatus = () => {
            document.getElementById('domain').textContent = window.location.hostname;
            document.getElementById('protocol').textContent = window.location.protocol;
            document.getElementById('has-token').textContent = localStorage.getItem('auth_token') ? 'Yes' : 'No';
            document.getElementById('auth-method').textContent = localStorage.getItem('auth_method') || 'None';
        };

        // Test login and redirect
        const testLoginAndRedirect = async () => {
            log('Starting login and redirect test...');
            
            try {
                // First login with token auth
                log('Attempting token login...');
                const response = await fetch('/api/token-auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@marinegroupbw.com'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log('Login successful!', 'success');
                    log(`Token: ${data.token.substring(0, 20)}...`);
                    
                    // Store token
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('auth_token_expiry', data.expiresAt);
                    localStorage.setItem('auth_method', 'token');
                    localStorage.setItem('marine_invoice_user', JSON.stringify(data.user));
                    
                    updateStatus();
                    
                    log('Attempting redirect in 2 seconds...');
                    setTimeout(() => {
                        log('Redirecting with window.location.href = "/app"');
                        window.location.href = '/app';
                    }, 2000);
                } else {
                    log('Login failed!', 'error');
                }
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        };

        // Test direct redirect
        const testDirectRedirect = () => {
            log('Testing direct redirect with window.location.href');
            window.location.href = '/app';
        };

        // Test location.replace
        const testLocationReplace = () => {
            log('Testing redirect with window.location.replace()');
            window.location.replace('/app');
        };

        // Test location.assign
        const testLocationAssign = () => {
            log('Testing redirect with window.location.assign()');
            window.location.assign('/app');
        };

        // Test meta redirect
        const testMetaRedirect = () => {
            log('Testing meta refresh redirect');
            const meta = document.createElement('meta');
            meta.httpEquiv = 'refresh';
            meta.content = '0; url=/app';
            document.head.appendChild(meta);
            log('Meta refresh tag added to head');
        };

        // Test form redirect
        const testFormRedirect = () => {
            log('Testing form-based redirect');
            document.getElementById('redirect-form').submit();
        };

        // Initialize
        updateStatus();
        log('Redirect test page loaded', 'success');
        log(`Current URL: ${window.location.href}`);
        
        // Check if we can access /app
        fetch('/app', { 
            method: 'HEAD',
            credentials: 'include'
        }).then(response => {
            if (response.ok || response.type === 'opaqueredirect') {
                log('/app endpoint is accessible', 'success');
            } else {
                log(`/app endpoint returned: ${response.status}`, 'warning');
            }
        }).catch(error => {
            log(`Error checking /app: ${error.message}`, 'error');
        });
    </script>
</body>
</html>
