<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessel Directory - MG Invoices</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="apple-touch-icon" href="./assets/favicon.png">
    <link rel="shortcut icon" href="./assets/favicon.png">

    <!-- Meta tags -->
    <meta name="description" content="Vessel directory and management for Marine Group Invoice Generator">

    <!-- CSS -->
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/typeahead-combobox.css">
    <link rel="stylesheet" href="./styles/customers-page.css">

    <style>
        /* Page-specific styles */
        body {
            background: rgb(24, 24, 27); /* zinc-900 */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .page-container {
            display: flex;
            min-height: 100vh;
        }

        .page-sidebar {
            width: 72px;
            background: rgb(9, 9, 11); /* zinc-950 to match invoice.png baseline */
            border-right: 1px solid rgb(39, 39, 42); /* zinc-800 */
            padding: 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .page-main {
            flex: 1;
            margin-left: 72px;
            min-height: 100vh;
        }

        .page-content {
            background: rgb(24, 24, 27);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Navigation styles */
        .nav-brand {
            padding: 1rem 0;
            text-align: center;
            border-bottom: 1px solid rgb(39, 39, 42);
        }

        .nav-brand h1 {
            color: rgb(99, 102, 241); /* indigo-500 */
            font-size: 1.125rem;
            font-weight: 700;
            margin: 0;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .nav-menu {
            padding: 1rem 0;
        }

        .nav-item {
            display: block;
            padding: 0.75rem;
            color: rgb(161, 161, 170); /* zinc-400 */
            text-decoration: none;
            text-align: center;
            border-radius: 0.5rem;
            margin: 0 0.5rem 0.5rem 0.5rem;
            transition: all 0.2s;
            position: relative;
        }

        .nav-item:hover {
            background: rgb(39, 39, 42); /* zinc-800 */
            color: white;
        }

        .nav-item.active {
            background: rgb(99, 102, 241); /* indigo-500 */
            color: white;
        }

        .nav-item svg {
            width: 1.5rem;
            height: 1.5rem;
            margin: 0 auto;
        }

        /* Tooltip styles */
        .nav-item::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            background: rgb(17, 17, 19);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            margin-left: 0.5rem;
            z-index: 1000;
        }

        .nav-item:hover::after {
            opacity: 1;
        }

        /* Auth panel styles */
        .auth-panel {
            position: absolute;
            bottom: 1rem;
            left: 0.5rem;
            right: 0.5rem;
            text-align: center;
        }

        .user-avatar {
            width: 2rem;
            height: 2rem;
            background: rgb(99, 102, 241);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            margin: 0 auto 0.5rem;
        }

        .auth-actions {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .auth-btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn {
            background: rgb(239, 68, 68);
            color: white;
        }

        .logout-btn:hover {
            background: rgb(220, 38, 38);
        }

        /* Error states */
        .error-message {
            background: rgb(239, 68, 68);
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgb(99, 102, 241);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .page-sidebar {
                transform: translateX(-100%);
                z-index: 1000;
            }

            .page-main {
                margin-left: 0;
            }

            /* Show sidebar when mobile menu is active */
            .mobile-menu-active .page-sidebar {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Sidebar Navigation -->
        <aside class="page-sidebar">
            <div class="nav-brand">
                <h1>MG</h1>
            </div>

            <nav class="nav-menu">
                <a href="/app" class="nav-item" data-tooltip="Invoices">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14,2 14,8 20,8"></polyline>
                    </svg>
                </a>

                <a href="/customers" class="nav-item" data-tooltip="Customers">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </a>

                <a href="/vessels" class="nav-item active" data-tooltip="Vessels">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </a>

                <a href="#" class="nav-item" data-tooltip="Settings">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </a>
            </nav>

            <!-- User Authentication Panel -->
            <div class="auth-panel">
                <div class="user-avatar" id="user-avatar">?</div>
                <div class="auth-actions">
                    <button class="auth-btn logout-btn" id="logout-btn">Logout</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="page-main">
            <div class="page-content">
                <!-- Vessels page content will be rendered here -->
                <div id="vessels-page">
                    <!-- Loading state -->
                    <div class="text-center py-12">
                        <div class="loading-spinner mx-auto mb-4"></div>
                        <p class="text-gray-400">Loading vessel directory...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Authentication Modal (shared component) -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg max-w-md w-full mx-4">
            <div class="p-6">
                <h2 class="text-xl font-semibold mb-4 text-gray-900">Authentication Required</h2>
                <p class="text-gray-600 mb-6">Please log in to access the vessel directory.</p>
                <div class="flex justify-end gap-3">
                    <button id="auth-cancel" class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200">
                        Cancel
                    </button>
                    <button id="auth-login" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                        Log In
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Message Container -->
    <div id="error-container" class="hidden fixed top-4 right-4 z-50">
        <div class="error-message max-w-md">
            <p id="error-message">An error occurred</p>
            <button id="error-close" class="float-right text-white hover:text-gray-200">×</button>
        </div>
    </div>

    <!-- JavaScript bundle injected by webpack -->
</body>
</html>
