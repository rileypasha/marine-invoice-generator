<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Changes - Master Dashboard</title>
    <link rel="stylesheet" href="/master/dashboard.css">
    <style>
        /* Change Tracking Styles */
        .changes-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .changes-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 10px 10px 0 0;
            margin-bottom: 0;
        }
        
        .changes-header h1 {
            margin: 0 0 1rem 0;
            font-size: 1.75rem;
        }
        
        .invoice-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            font-size: 0.9rem;
            opacity: 0.95;
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
        }
        
        .meta-label {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-bottom: 0.25rem;
        }
        
        .meta-value {
            font-weight: 600;
        }
        
        .changes-legend {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1rem;
            margin: 1.5rem 0;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .legend-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
        
        .legend-added {
            background: #d4edda;
            color: #155724;
        }
        
        .legend-removed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .legend-modified {
            background: #fff3cd;
            color: #856404;
        }
        
        .changes-section {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        
        .section-header {
            background: #f8f9fa;
            padding: 1rem;
            border-bottom: 1px solid #dee2e6;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .change-count {
            background: #6c757d;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        .changes-list {
            padding: 1rem;
        }
        
        .change-item {
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 1rem;
            align-items: start;
        }
        
        .change-field {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
        }
        
        .change-values {
            display: flex;
            gap: 1rem;
            align-items: start;
            flex-wrap: wrap;
        }
        
        .value-added {
            color: #155724;
            background: #d4edda;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            border: 1px solid #c3e6cb;
        }
        
        .value-removed {
            color: #721c24;
            background: #f8d7da;
            text-decoration: line-through;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
        }
        
        .value-old {
            color: #721c24;
            text-decoration: line-through;
            opacity: 0.8;
        }
        
        .value-new {
            color: #155724;
            font-weight: 600;
        }
        
        .arrow {
            color: #6c757d;
            margin: 0 0.5rem;
        }
        
        .line-items-section {
            padding: 1rem;
        }
        
        .line-item {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .line-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #dee2e6;
        }
        
        .line-item-title {
            font-weight: 600;
        }
        
        .line-item-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-added {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-removed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .badge-modified {
            background: #fff3cd;
            color: #856404;
        }
        
        .line-item-changes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 0.5rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .actions-bar {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a67d8;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .loading {
            text-align: center;
            padding: 4rem;
            color: #6c757d;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1>Invoice Changes Tracker</h1>
            </div>
            <div class="header-right">
                <span id="userInfo" class="user-info"></span>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="changes-container">
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <p>Loading invoice changes...</p>
            </div>
            
            <div id="changesContent" style="display: none;">
                <!-- Changes Header -->
                <div class="changes-header">
                    <h1 id="invoiceTitle">Invoice Changes</h1>
                    <div class="invoice-meta">
                        <div class="meta-item">
                            <span class="meta-label">Invoice Number</span>
                            <span class="meta-value" id="invoiceNumber">-</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Customer</span>
                            <span class="meta-value" id="customerName">-</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Originally Submitted</span>
                            <span class="meta-value" id="submittedAt">-</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Last Modified</span>
                            <span class="meta-value" id="lastModified">-</span>
                        </div>
                    </div>
                </div>
                
                <!-- Legend -->
                <div class="changes-legend">
                    <div class="legend-item">
                        <div class="legend-icon legend-added">✓</div>
                        <span>Added</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon legend-removed">—</div>
                        <span>Removed</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon legend-modified">↔</div>
                        <span>Modified</span>
                    </div>
                </div>
                
                <!-- Changes Sections -->
                <div id="changesSections">
                    <!-- Populated dynamically -->
                </div>
                
                <!-- Actions Bar -->
                <div class="actions-bar">
                    <button id="backBtn" class="btn btn-secondary">← Back to Dashboard</button>
                    <button id="markSeenBtn" class="btn btn-primary">Mark as Reviewed</button>
                </div>
            </div>
            
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📋</div>
                <h2>No Changes Found</h2>
                <p>This invoice has not been modified since it was submitted.</p>
                <button id="backBtnEmpty" class="btn btn-primary">Back to Dashboard</button>
            </div>
        </main>
    </div>

    <script src="/master/changes.js"></script>
</body>
</html>
