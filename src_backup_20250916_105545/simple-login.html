<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Invoices - Simple Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: #16213e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4fbdba;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #0f3460;
            color: #fff;
            font-size: 16px;
        }
        
        input:focus {
            outline: none;
            border-color: #4fbdba;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #4fbdba;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #7ec8e3;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        
        .success {
            background: #28a745;
            color: #fff;
        }
        
        .error {
            background: #dc3545;
            color: #fff;
        }
        
        .info {
            background: #17a2b8;
            color: #fff;
        }
        
        .test-account {
            margin-top: 20px;
            padding: 15px;
            background: rgba(79, 189, 186, 0.1);
            border: 1px solid #4fbdba;
            border-radius: 5px;
        }
        
        .test-account h3 {
            color: #4fbdba;
            margin-bottom: 10px;
        }
        
        .test-account p {
            color: #aaa;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚢 MG Invoices Login</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required value="test@marinegroupbw.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required value="test">
            </div>
            
            <button type="submit" id="submitBtn">Sign In</button>
        </form>
        
        <div id="message"></div>
        
        <div class="test-account">
            <h3>Test Account</h3>
            <p>Email: test@marinegroupbw.com</p>
            <p>Password: Any value (e.g., "test")</p>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        function showMessage(text, type) {
            messageDiv.className = 'message ' + type;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            showMessage('Attempting login...', 'info');
            
            try {
                // Call the login API
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Store user data in localStorage
                    localStorage.setItem('marine_invoice_user', JSON.stringify(data.user));
                    localStorage.setItem('marine_invoice_session', JSON.stringify({
                        timestamp: Date.now(),
                        valid: true
                    }));
                    
                    showMessage('Login successful! Redirecting...', 'success');
                    
                    // Redirect to app after short delay
                    setTimeout(() => {
                        window.location.href = '/app';
                    }, 1000);
                } else {
                    showMessage(data.error || 'Login failed. Please try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Network error. Please check your connection.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
        
        // Auto-focus email field
        document.getElementById('email').focus();
    </script>
</body>
</html>
