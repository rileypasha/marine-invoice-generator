<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Redirect Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            display: block;
            margin: 10px 0;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        .log {
            background: #f0f0f0;
            padding: 10px;
            margin: 20px 0;
            border: 1px solid #ddd;
            max-height: 300px;
            overflow-y: auto;
        }
        .info {
            background: #e3f2fd;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Simple Redirect Test</h1>
    
    <div class="info">
        <strong>Current URL:</strong> <span id="current-url"></span><br>
        <strong>Origin:</strong> <span id="origin"></span><br>
        <strong>Pathname:</strong> <span id="pathname"></span>
    </div>
    
    <h2>Test Different Redirect Methods</h2>
    
    <button onclick="testRelativeRedirect()">Test: window.location.href = '/app'</button>
    <button onclick="testFullRedirect()">Test: Full URL redirect</button>
    <button onclick="testReplaceRedirect()">Test: location.replace('/app')</button>
    <button onclick="testAssignRedirect()">Test: location.assign('/app')</button>
    <button onclick="testLinkClick()">Test: Create and click link</button>
    <button onclick="testFormSubmit()">Test: Form submit to /app</button>
    
    <h2>Direct Links</h2>
    <a href="/app" style="display: block; margin: 10px 0;">Direct link to /app</a>
    <a href="/hybrid-login" style="display: block; margin: 10px 0;">Go to login page</a>
    
    <h2>Log</h2>
    <div id="log" class="log"></div>
    
    <form id="test-form" action="/app" method="GET" style="display: none;"></form>
    
    <script>
        // Update current info
        document.getElementById('current-url').textContent = window.location.href;
        document.getElementById('origin').textContent = window.location.origin;
        document.getElementById('pathname').textContent = window.location.pathname;
        
        function log(message) {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${message}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(message);
        }
        
        function testRelativeRedirect() {
            log('Testing: window.location.href = "/app"');
            window.location.href = '/app';
        }
        
        function testFullRedirect() {
            const fullUrl = window.location.origin + '/app';
            log('Testing: window.location.href = "' + fullUrl + '"');
            window.location.href = fullUrl;
        }
        
        function testReplaceRedirect() {
            log('Testing: window.location.replace("/app")');
            window.location.replace('/app');
        }
        
        function testAssignRedirect() {
            log('Testing: window.location.assign("/app")');
            window.location.assign('/app');
        }
        
        function testLinkClick() {
            log('Testing: Creating and clicking a link');
            const link = document.createElement('a');
            link.href = '/app';
            document.body.appendChild(link);
            link.click();
        }
        
        function testFormSubmit() {
            log('Testing: Form submit to /app');
            document.getElementById('test-form').submit();
        }
        
        log('Page loaded. Ready for testing.');
    </script>
</body>
</html>
