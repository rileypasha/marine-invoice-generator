<!DOCTYPE html>
<html>
<head>
    <title>Direct Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test-btn { 
            background: red; 
            color: white; 
            padding: 15px; 
            font-size: 16px; 
            border: none; 
            margin: 10px;
            cursor: pointer;
        }
        .result { 
            background: #f0f0f0; 
            padding: 10px; 
            margin: 10px 0; 
            border-left: 3px solid #333;
        }
        iframe { width: 100%; height: 600px; border: 2px solid red; }
    </style>
</head>
<body>
    <h1>DIRECT TEST OF NEW INVOICE BUTTON</h1>
    
    <button class="test-btn" onclick="loadApp()">LOAD APP</button>
    <button class="test-btn" onclick="testButton()">TEST BUTTON</button>
    <button class="test-btn" onclick="testConsole()">CHECK CONSOLE</button>
    
    <div id="results"></div>
    <iframe id="appFrame" style="display:none;"></iframe>

    <script>
        let appFrame;
        
        function log(message) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result';
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            results.appendChild(div);
        }
        
        function loadApp() {
            log('Loading app...');
            appFrame = document.getElementById('appFrame');
            appFrame.src = 'http://localhost:3000';
            appFrame.style.display = 'block';
            
            appFrame.onload = () => {
                log('App loaded successfully');
                
                setTimeout(() => {
                    try {
                        const doc = appFrame.contentDocument;
                        const win = appFrame.contentWindow;
                        
                        log('App window: ' + !!win);
                        log('App document: ' + !!doc);
                        log('Sidebar exists: ' + !!doc.querySelector('.app-sidebar'));
                        log('Button exists: ' + !!doc.querySelector('.new-invoice-btn'));
                        log('window.app exists: ' + !!win.app);
                        log('testNewInvoiceButton exists: ' + !!win.testNewInvoiceButton);
                        
                    } catch (e) {
                        log('Error accessing iframe: ' + e.message);
                    }
                }, 3000);
            };
        }
        
        function testButton() {
            if (!appFrame) {
                log('App not loaded yet!');
                return;
            }
            
            try {
                const doc = appFrame.contentDocument;
                const win = appFrame.contentWindow;
                
                // Fill vessel name
                const vesselInput = doc.querySelector('#vessel-name');
                if (vesselInput) {
                    vesselInput.value = 'TEST VESSEL';
                    log('Filled vessel name with: TEST VESSEL');
                } else {
                    log('Vessel input not found!');
                }
                
                // Try clicking button
                const button = doc.querySelector('.new-invoice-btn');
                if (button) {
                    log('Clicking new invoice button...');
                    button.click();
                    
                    setTimeout(() => {
                        const newValue = vesselInput ? vesselInput.value : 'INPUT NOT FOUND';
                        log('Vessel name after click: "' + newValue + '"');
                        
                        if (newValue === '') {
                            log('✅ SUCCESS: Field was cleared!');
                        } else {
                            log('❌ FAILED: Field was not cleared!');
                        }
                    }, 1000);
                    
                } else {
                    log('Button not found!');
                }
                
                // Try global function
                if (win.testNewInvoiceButton) {
                    log('Calling global test function...');
                    win.testNewInvoiceButton();
                } else {
                    log('Global test function not found!');
                }
                
            } catch (e) {
                log('Error testing button: ' + e.message);
            }
        }
        
        function testConsole() {
            if (!appFrame) {
                log('App not loaded yet!');
                return;
            }
            
            try {
                const win = appFrame.contentWindow;
                
                // Override console.log in iframe to capture messages
                const originalLog = win.console.log;
                const messages = [];
                
                win.console.log = function(...args) {
                    messages.push(args.join(' '));
                    originalLog.apply(win.console, args);
                };
                
                setTimeout(() => {
                    log('Captured ' + messages.length + ' console messages');
                    messages.slice(0, 5).forEach(msg => {
                        log('Console: ' + msg);
                    });
                }, 1000);
                
            } catch (e) {
                log('Error checking console: ' + e.message);
            }
        }
    </script>
</body>
</html>
